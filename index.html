<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NOVITTA CONNECT</title><meta name="theme-color" content="#344D35"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#344D35;--o:#71865A;--s:#A9B99A;--c:#F5F0E6;--k:#17251B;--bg:#F5F0E6;--card:#fff;--tx:#17251B;--mu:#5d6b5f;--acc:#344D35;--on:#fff;--ln:#e4dfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17251B;--card:#22342a;--tx:#F5F0E6;--mu:#A9B99A;--acc:#8fa877;--on:#17251B;--ln:#33463a}}
:root[data-theme=dark]{--bg:#17251B;--card:#22342a;--tx:#F5F0E6;--mu:#A9B99A;--acc:#8fa877;--on:#17251B;--ln:#33463a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font-family:Inter,Poppins,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
main{flex:1;overflow-y:auto;padding:16px 16px 90px}
h1,h2,h3{margin:0}h2{font-size:20px;margin:6px 0 12px}h3{font-size:15px}small,.mu{color:var(--mu);font-size:12px}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(23,37,27,.07);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.w{flex-wrap:wrap}
button,select,input{font:inherit}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.l{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}.btn.full{width:100%}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);margin:4px 0}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--s);color:var(--k);font-weight:600}.chip.e{background:#f3c9b8}.chip.n{background:var(--ln);color:var(--mu)}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px}nav button.on{color:var(--acc);font-weight:700}nav b{font-size:20px}
.fab{position:absolute;right:14px;bottom:78px;width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
.hero{background:linear-gradient(135deg,#344D35,#71865A);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px}
.ch{width:100%;height:110px}.big{font-size:26px;font-weight:700}
.bottle{width:90px;height:190px;border:4px solid var(--acc);border-radius:26px 26px 18px 18px;position:relative;overflow:hidden;margin:auto;background:var(--card)}
.bottle i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#7fc4d8,#4a9bb8);transition:height .8s cubic-bezier(.3,.8,.3,1)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;padding:8px;border-radius:10px;background:var(--ln);color:var(--tx);cursor:pointer}.tabs .on{background:var(--acc);color:var(--on)}
.tog{width:44px;height:26px;border-radius:99px;background:var(--ln);border:0;position:relative;cursor:pointer;flex:none}.tog.on{background:var(--acc)}.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog.on:after{left:21px}
.msg{padding:9px 12px;border-radius:16px;margin:6px 0;max-width:85%;font-size:14px}.me{background:var(--acc);color:var(--on);margin-left:auto}.ia{background:var(--card)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;padding:16px;animation:in .25s}
.warn{background:#f8e7c9;color:#5a3d00;border-radius:14px;padding:10px;font-size:13px;margin:8px 0}
.tile{overflow:hidden;height:84px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,var(--s),var(--o));margin-bottom:8px}
.tile img{width:100%;height:100%;object-fit:cover}.glow{height:90px;border-radius:50px;transition:background 1s;margin:10px 0}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.45}}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
:focus-visible{outline:3px solid #f0ad4e;outline-offset:2px}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--on);padding:12px 16px;border-radius:14px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)}
main.easy{--bg:#fff;--card:#f5f0e6;--tx:#000;--acc:#1f3a22;--on:#fff;--mu:#222;--ln:#777;background:#fff;color:#000;font-size:22px}
.et{font-size:34px;margin:8px 0}.es{font-size:22px;line-height:1.4}
.eb{display:flex;align-items:center;gap:16px;width:100%;font-size:24px;padding:20px;margin:12px 0;border-radius:20px;border:3px solid var(--acc);background:var(--acc);color:var(--on);font-weight:700;cursor:pointer}
.eb.l{background:transparent;color:var(--acc)}.big4{font-size:26px}.big4 span{font-size:40px}.eb.danger{background:#b3261e;border-color:#b3261e;color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.fab,.noprint{display:none!important}#app{height:auto}main{overflow:visible}}

<div class="card"><h3>Preferências</h3><button class="btn sm" data-a="easyon" style="margin-bottom:8px">Ativar NOVITTA EASY</button><div class="row"><button class="btn sm l" data-a="th" data-v="light">Claro</button><button class="btn sm l" data-a="th" data-v="dark">Escuro</button></div></div>
<button class="btn l full" data-a="reset" style="margin-bottom:8px">Reiniciar demonstração</button><button class="btn l full" data-a="wipe" style="margin-bottom:8px">Excluir meus dados</button><button class="btn full" data-a="out">Sair</button>
<p class="mu" style="text-align:center;margin-top:16px">Empresa simulada — Projeto acadêmico.</p>`}

function chat(){return`<div class="sheet"><div class="row sp"><h2 style="margin:0">🌿 NOVITTA IA</h2><button class="x" data-a="chatx">✕</button></div><small>Assistente baseado em regras (sem IA externa) que consulta seus dados simulados. Não fornece diagnóstico nem prescrição.</small>
<div style="flex:1;overflow-y:auto;margin:8px 0" id="cm">${S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')||'<div class="msg ia">Olá! Posso ajudar com hábitos, metas e seus produtos.</div>'}${V.ty?'<div class="msg ia pulse">NOVITTA IA está digitando…</div>':''}</div>
<div class="row w" style="margin-bottom:6px">${['Quanto de água eu bebi hoje?','Como foi meu sono esta semana?','Quais metas ainda preciso completar?','Quais dispositivos estão conectados?','Qual foi minha última sessão de skincare?','Mostre meu progresso de hidratação.'].map(q=>`<button class="btn sm l" data-a="ask" data-v="${q}">${q}</button>`).join('')}</div>
<div class="row"><input id="ci" placeholder="Pergunte algo…"><button class="btn" data-a="send">➤</button></div></div>`}
function reply(q){q=q.toLowerCase();const wk=S.hist.slice(-6).map(h=>h.w).concat(S.w),on=D.filter(d=>d.ble&&cs(d.id)=='on').map(d=>d.n),p=pct(S.w,S.wg),k=Math.round(p/10);
if(/dispositiv|conectad/.test(q))return on.length?'Conectados (simulado): '+on.join(', ')+'.':'Nenhum dispositivo conectado no simulador. Vá em Dispositivos › Conectar.';
if(/skincare|rotina|facial|pele|cuidado/.test(q)){const l=S.log.find(x=>dev(x.d)&&dev(x.d).k=='skin');return(l?'Seu último registro de skincare: '+dev(l.d).n+' em '+l.t+'. ':'Ainda não há registros de skincare. ')+'Sugestão geral: limpeza → toner → sérum → creme; de dia, protetor solar e reaplicação.'}
if(/progress|água|agua|hidrat|bebi/.test(q))return`Hoje: ${S.w} ml de ${S.wg} ml (${p}%). ${'▓'.repeat(k)}${'░'.repeat(10-k)} Média dos últimos dias: ${Math.round(wk.reduce((a,b)=>a+b,0)/wk.length)} ml. (dados simulados)`;
if(/sono|dorm/.test(q))return`Média da semana: ${(sleepW.reduce((a,b)=>a+b,0)/7).toFixed(1)} h por noite (simulado). Horários regulares costumam ajudar.`;
if(/meta|falta|complet/.test(q)){const f=[];if(S.w<S.wg)f.push(`beber mais ${S.wg-S.w} ml`);if(S.st<S.sg)f.push(`andar mais ${S.sg-S.st} passos`);return f.length?'Para hoje, faltam: '+f.join(' e ')+'.':'Metas de hoje concluídas! 🎉'}
if(/produto/.test(q))return'Catálogo: '+D.map(d=>d.n).join(', ')+'.';
if(/dor|doen|remédio|diagn|medic/.test(q))return'Não faço orientação médica. Procure um profissional de saúde.';
return'Sou um assistente demonstrativo baseado em regras (sem IA externa). Pergunte sobre água, sono, metas, dispositivos ou skincare.'}
function toast(m){const t=document.createElement('div');t.setAttribute('role','status');t.className='toast';t.textContent='🔔 '+m;document.body.appendChild(t);setTimeout(()=>t.remove(),6000);try{if('Notification' in window&&Notification.permission=='granted')new Notification('NOVITTA CONNECT',{body:m})}catch(e){}}
setInterval(()=>{if(!S.u)return;const d=new Date(),hm=d.toTimeString().slice(0,5),wd=d.getDay(),ok=x=>x=='Dias úteis'?wd>0&&wd<6:x=='Fins de semana'?(wd==0||wd==6):1;S.rem.forEach((r,i)=>{const k=today()+i+r.h;if(r.on!==false&&r.h==hm&&ok(r.dy)&&!S.fired[k]){S.fired[k]=1;toast(r.t);save()}})},20000);
function evo(){const P=V.hp2||'7 dias';if(P=='Hoje')return bars([S.w/4,S.w/3,S.w/2.4,S.w].map(Math.round),['9h','12h','15h','agora'])+'<small>Água acumulada hoje (ml)</small>';const n=P=='7 dias'?7:30,H=S.hist,a=[],l=[];for(let i=0;i<n;i++){const k=n-1-i,x=k?H[H.length-k]:null;a.push(k==0?S.st:x?x.st:5000+(i*7919)%4000);l.push(k==0?'hoje':(n==7||k%5==0?'-'+k:''))}return bars(a,l)+'<small>Passos por dia</small>'}
function easy(){const e=V.ez,back='<button class="eb l" data-a="ez" data-v="">← Voltar</button>';let b;
if(!e)b=`<h1 class="et">NOVITTA EASY</h1><p class="es">Tecnologia para Todos</p>${[['health','❤️','MINHA SAÚDE'],['rem','🔔','MEUS LEMBRETES'],['fam','👨‍👩‍👧','MINHA FAMÍLIA'],['help','🆘','PEDIR AJUDA']].map(x=>`<button class="eb big4" data-a="ez" data-v="${x[0]}"><span aria-hidden="true">${x[1]}</span>${x[2]}</button>`).join('')}<button class="eb l" data-a="easyoff">Sair do modo EASY</button><p class="es">Empresa simulada — Projeto acadêmico. Integrado ao NOVITTA GLASSES IA (simulado).</p>`;
else if(e=='health')b=back+`<h2 class="et">Minha saúde</h2><div class="card"><p class="es">💧 Água: <b>${S.w} ml</b> de ${S.wg}</p><button class="eb" data-a="water" data-v="200">Beber +200 ml</button><p class="es">👟 Passos: <b>${S.st}</b></p><p class="es">😴 Sono: <b>7h24</b></p><small>Dados simulados</small></div>`;
else if(e=='rem')b=back+`<h2 class="et">Meus lembretes</h2>${S.rem.map(r=>`<div class="card es">🔔 ${esc(r.t)} — ${r.h}</div>`).join('')}${S.med.map(m=>`<div class="card es">💊 ${esc(m)}</div>`).join('')}`;
else if(e=='fam')b=back+`<h2 class="et">Minha família</h2>${(S.fam||[]).map(x=>`<div class="card es">👤 ${esc(x)}</div>`).join('')||'<p class="es">Nenhum contato.</p>'}<label class="es" for="fn">Novo contato de confiança (fictício)</label><input id="fn" maxlength="40" style="font-size:22px"><button class="eb" data-a="addfam">Adicionar</button>`;
else b=back+`<h2 class="et">Pedir ajuda</h2><p class="es">Demonstração visual. <b>Nenhuma chamada ou mensagem real será enviada.</b></p><button class="eb danger" data-a="help">🆘 PEDIR AJUDA</button>${V.hp?'<div class="card es" role="alert">✅ Pedido de ajuda SIMULADO enviado aos contatos fictícios.</div>':''}`;
return`<main class="easy">${b}</main>`}
function render(){const A=$('#app');if(!S.u){A.innerHTML=auth();return}if(S.easy){A.innerHTML=easy();return}
const tabs=[['home','🏠','Início'],['dev','⌚','Dispositivos'],['rot','📅','Rotinas'],['shop','🛍️','Loja'],['prof','👤','Perfil']];
const body={home,dev:devices,rot:routines,shop,prof:profile}[V.tab]();
A.innerHTML=`<main>${body}</main><button class="fab" data-a="chat" aria-label="NOVITTA IA">🌿</button><nav aria-label="Navegação principal">${tabs.map(t=>`<button class="${V.tab==t[0]?'on':''}" aria-current="${V.tab==t[0]?'page':'false'}" data-a="tab" data-v="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>${V.chat?chat():''}${V.cw?wiz():''}`;
const q=$('#q');if(q&&V.tab=='shop'){q.oninput=e=>{V.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
const cm=$('#cm');if(cm)cm.scrollTop=1e9}
const val=s=>s&&s[0]=='@'?($(s.replace('@','#'))||{}).value:s;
const A={
tab:v=>{V.tab=v;V.dev=null;V.pd=null;V.ck=0},open:v=>{V.tab=v&&dev(v).k=='skin'&&V.tab=='rot'?'dev':V.tab;V.tab='dev';V.dev=v},back:()=>V.dev=null,per:v=>V.per=v,
am:v=>{V.auth=v;V.err=''},demo:()=>{S.u={n:'Marina Souza',e:'demo@novitta.app'}},
auth:()=>{const em=clean(($('#em')||{}).value,80),pw=($('#pw')||{}).value||'',nm=clean(($('#nm')||{}).value,40);V.err='';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){V.err='Digite um e-mail válido (pode ser fictício).';return}if(V.auth=='rec'){alert('Fluxo demonstrativo: nenhum e-mail foi enviado.');V.auth='login';return}if(pw.length<6){V.err='A senha deve ter ao menos 6 caracteres (ela não é salva).';return}if(V.auth=='signup'){if(nm.length<2){V.err='Informe seu nome (fictício).';return}if(!$('#lg').checked){V.err='Aceite o consentimento para continuar.';return}}S.u={n:nm||'Usuário Demo',e:em}},
out:()=>S.u=null,wipe:()=>{if(confirm('Excluir todos os dados do protótipo e sair?')){S=JSON.parse(JSON.stringify(def));S.hist=[];S.date=today();seed();V.tab='home';V.T=null;try{localStorage.removeItem(K)}catch(e){}}},
reset:()=>{if(confirm('Restaurar os dados fictícios e reiniciar a demonstração?')){const u=S.u;S=JSON.parse(JSON.stringify(def));S.u=u;S.hist=[];S.date=today();seed();V.T=null;clearInterval(V.iv)}},
water:v=>S.w+=+v,wc:()=>{const x=+$('#cw').value;if(x>0&&x<=2000)S.w+=x},
tg:v=>{if(v=='led')S.led=!S.led;else if(v.startsWith('nt'))S.nt[v.slice(2)]=+!S.nt[v.slice(2)];else if(v.startsWith('rm')){const r=S.rem[+v.slice(2)];r.on=r.on===false}else if(v.startsWith('pv'))S.pv[v.slice(2)]=+!S.pv[v.slice(2)]},
cn:id=>{if(cs(id)=='on'){S.cs[id]='off';return}V.cw={id,s:0};const st=()=>{if(!V.cw)return;V.cw.s++;if(V.cw.s>=6){S.cs[id]='on';S.sy=S.sy||{};S.sy[id]=now();V.cw=null}save();render();if(V.cw)setTimeout(st,1000)};setTimeout(st,1000)},
cwx:()=>{V.cw=null},
sync:()=>{S.st+=120+Math.floor(Math.random()*200);S.sy=S.sy||{};S.sy.ring=now()},
addrem:v=>{const[a,b]=v.split('|'),t=clean(val(a)),h=val(b);if(!t){alert('Digite um nome para o lembrete.');return}S.rem.push({t,h:h||'08:00',c:($('#nc')||{}).value||'Geral',dy:($('#nd')||{}).value||'Todos os dias'})},delrem:i=>S.rem.splice(i,1),
addmed:()=>{const v=clean($('#md').value,80);if(v)S.med.push(v)},delmed:i=>S.med.splice(i,1),
chal:()=>{S.md=Math.min(3,S.md+1);S.log.unshift({d:'kids',t:now(),x:'Desafio concluído'})},
int:v=>{const[a,b]=v.split('|');S['i'+a]=+b},
start:id=>{if(V.T&&V.T.id!=id){alert('Já existe uma sessão em andamento em outro produto.');return}V.T={id,l:300,p:0};clearInterval(V.iv);V.iv=setInterval(tick,1000)},
pause:()=>{if(V.T)V.T.p=1},resume:()=>{if(V.T)V.T.p=0},
stop:()=>{if(V.T)S.log.unshift({d:V.T.id,t:now(),x:'Sessão encerrada ('+fmt(300-V.T.l)+' de 05:00)'});clearInterval(V.iv);V.T=null},
use:id=>{const b=$('#bv');S.log.unshift({d:id,t:now(),x:b?'Bebida '+b.value:'Uso registrado'})},
cat:v=>V.cat=v,pd:v=>V.pd=v,pdx:()=>V.pd=null,add:v=>S.cart[v]=(S.cart[v]||0)+1,rm:v=>delete S.cart[v],fav:v=>S.fav[v]=!S.fav[v],ck:()=>V.ck=1,ckx:()=>V.ck=0,
pay:()=>{if(cartN()){alert('Pedido simulado concluído! Nenhum pagamento real foi processado.');S.cart={};V.ck=0}},
chat:()=>V.chat=1,chatx:()=>V.chat=0,ask:q=>{q=clean(q,200);if(!q)return;S.chat.push({r:'me',t:q});V.ty=1;setTimeout(()=>{S.chat.push({r:'ia',t:reply(q)});V.ty=0;save();render()},800)},send:()=>{const i=$('#ci');if(i)A.ask(i.value)},
th:v=>document.documentElement.dataset.theme=v,
dec:k=>{if(S.cart[k]>1)S.cart[k]--;else delete S.cart[k]},hp2:v=>V.hp2=v,rp:v=>V.rp=v,rq:v=>V.rq=v,pdf:()=>{try{window.print()}catch(e){alert('Use Ctrl+P para salvar como PDF.')}},
perm:()=>{try{Notification.requestPermission().then(p=>toast(p=='granted'?'Notificações do sistema ativadas':'Permissão não concedida'))}catch(e){alert('Seu navegador não suporta notificações.')}},
easyon:()=>{S.easy=1;V.ez=''},easyoff:()=>{S.easy=0},ez:v=>{V.ez=v;V.hp=0},
addfam:()=>{const v=clean(($('#fn')||{}).value,40);if(v){S.fam=S.fam||[];S.fam.push(v)}},help:()=>{if(confirm('Enviar um pedido de ajuda SIMULADO? Nada será enviado de verdade.'))V.hp=1}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT')return;const f=A[el.dataset.a];if(f){f(el.dataset.v);save();render()}});
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a=='gw')S.wg=+e.target.value||2500;if(a=='gs')S.sg=+e.target.value||8000;if(a=='rf'){V.rf=e.target.value;render()}save()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci'){A.send();save();render()}if((e.key=='Enter'||e.key==' ')&&e.target.getAttribute('role')=='button'){e.preventDefault();e.target.click()}});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
